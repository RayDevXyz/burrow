<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Burrow settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { max-width: 560px; margin: 40px auto; padding: 0 16px; font-size: 14px; }
    section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 18px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    ol { padding-left: 20px; color: var(--muted); }
    kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="brand" style="font-size:20px"><img src="icons/48.png" alt="" style="width:32px;height:32px">Burrow</div>
  <section>
    <h2>Connect to your server</h2>
    <ol>
      <li>Open your Burrow web app → <b>Settings</b> → <b>New token</b>.</li>
      <li>Paste the server URL and token below.</li>
    </ol>
    <label class="lbl">Server URL</label>
    <input class="input" id="server" placeholder="https://burrow.example.com or http://localhost:3000">
    <label class="lbl">API token</label>
    <input class="input" id="token" type="password" placeholder="brw_…">
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="save">Save & test</button>
      <span id="status" class="grow"></span>
    </div>
  </section>
  <section>
    <h2>Keyboard shortcuts</h2>
    <p class="muted"><kbd>Alt+Shift+S</kbd> save popup · <kbd>Alt+Shift+B</kbd> instant save · <kbd>Alt+Shift+T</kbd> tab manager.
      Change them at <a href="#" id="shortcuts">chrome://extensions/shortcuts</a>.</p>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
